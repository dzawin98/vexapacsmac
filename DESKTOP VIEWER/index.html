<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/vexa.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Viewer</title>
    <!-- The SPA bundle is ~1.3 MB compressed, so on a slow client link the tab
         shows an empty black page for many seconds before React can paint. This
         inline splash is styled to match .launch-blank-page and is replaced by
         the real UI the moment React mounts, so the wait is visible instead of
         looking like a dead tab. Keep it dependency-free and inline. -->
    <style>
      #vexa-boot {
        position: fixed;
        inset: 0;
        display: grid;
        place-content: center;
        justify-items: center;
        gap: 0.9rem;
        background: #050505;
        color: #d8d8d8;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
        font-size: 0.82rem;
        letter-spacing: 0.02em;
      }
      #vexa-boot .vexa-boot-mark {
        width: 2.4rem;
        height: 2.4rem;
        border: 2px solid rgba(134, 200, 181, 0.25);
        border-top-color: rgba(134, 200, 181, 0.95);
        border-radius: 999px;
        animation: vexa-boot-spin 0.9s linear infinite;
      }
      #vexa-boot .vexa-boot-text {
        opacity: 0.72;
      }
      @keyframes vexa-boot-spin {
        to { transform: rotate(360deg); }
      }
      @media (prefers-reduced-motion: reduce) {
        #vexa-boot .vexa-boot-mark { animation-duration: 2.5s; }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <div id="vexa-boot" role="status" aria-live="polite">
      <div class="vexa-boot-mark" aria-hidden="true"></div>
      <div class="vexa-boot-text">Memuat viewer…</div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
